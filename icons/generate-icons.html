<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DUO Icon Generator</title>
  <style>
    body { background:#111; color:#fff; font-family:monospace; padding:24px; }
    h2   { color:#be1e2d; }
    .row { display:flex; gap:16px; flex-wrap:wrap; margin:16px 0; }
    canvas { border:1px solid #333; border-radius:8px; }
    button {
      background:#be1e2d; color:#fff; border:none; padding:12px 28px;
      font-size:16px; cursor:pointer; border-radius:8px; margin-top:16px;
    }
    button:hover { background:#d42435; }
    #log { margin-top:16px; color:#aaa; font-size:13px; }
  </style>
</head>
<body>
  <h2>DUO PWA Icon Generator</h2>
  <p>اضغط الزر لتوليد جميع أحجام الأيقونات وتنزيلها.</p>
  <div class="row" id="previews"></div>
  <button onclick="generateAll()">توليد الأيقونات وتنزيلها</button>
  <div id="log"></div>

<script>
const SIZES  = [72, 96, 128, 144, 152, 192, 384, 512];
const BG     = '#000000';
const RED    = '#be1e2d';
const WHITE  = '#ffffff';

function drawIcon(canvas, size) {
  const ctx  = canvas.getContext('2d');
  canvas.width  = size;
  canvas.height = size;
  const r = size * 0.12;

  // Background rounded rect
  ctx.fillStyle = BG;
  roundRect(ctx, 0, 0, size, size, r);
  ctx.fill();

  // Red top strip
  const strip = Math.max(4, size * 0.055);
  ctx.fillStyle = RED;
  roundRect(ctx, 0, 0, size, strip, { tl: r, tr: r, bl: 0, br: 0 });
  ctx.fill();

  // Red circle
  const cx = size / 2;
  const cy = size / 2 + strip / 2;
  const radius = size * 0.32;
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // Letter "D" in white
  const fw   = size * 0.18;
  const fh   = size * 0.38;
  const x0   = cx - fw * 0.85;
  const y0   = cy - fh / 2;
  const bar  = Math.max(2, size * 0.04);
  const curveW = fw * 1.2;

  ctx.fillStyle = WHITE;
  // Vertical bar (left)
  ctx.fillRect(x0, y0, bar * 1.8, fh);
  // Top bar
  ctx.fillRect(x0, y0, curveW * 0.75, bar * 1.8);
  // Bottom bar
  ctx.fillRect(x0, y0 + fh - bar * 1.8, curveW * 0.75, bar * 1.8);
  // Right curve (approximated)
  ctx.beginPath();
  ctx.arc(x0 + bar * 1.8, cy, fh / 2 - bar * 1.8, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(x0 + bar * 1.8, y0);
  ctx.closePath();
  ctx.fill();

  // Mask out inner area (make D hollow in the curve)
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(x0 + bar * 1.8, cy, fh / 2 - bar * 4, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(x0 + bar * 1.8 * 3, y0 + bar * 4);
  ctx.closePath();
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, radii) {
  if (typeof radii === 'number') {
    radii = { tl: radii, tr: radii, br: radii, bl: radii };
  }
  ctx.beginPath();
  ctx.moveTo(x + radii.tl, y);
  ctx.lineTo(x + w - radii.tr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radii.tr);
  ctx.lineTo(x + w, y + h - radii.br);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radii.br, y + h);
  ctx.lineTo(x + radii.bl, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radii.bl);
  ctx.lineTo(x, y + radii.tl);
  ctx.quadraticCurveTo(x, y, x + radii.tl, y);
  ctx.closePath();
}

// Render previews on load
window.onload = () => {
  const row = document.getElementById('previews');
  SIZES.forEach(size => {
    const display = Math.min(size, 80);
    const canvas  = document.createElement('canvas');
    canvas.style.width  = display + 'px';
    canvas.style.height = display + 'px';
    drawIcon(canvas, size);
    const label = document.createElement('div');
    label.style.textAlign = 'center';
    label.style.fontSize  = '11px';
    label.style.color     = '#888';
    label.textContent     = size + 'x' + size;
    const wrap = document.createElement('div');
    wrap.style.textAlign = 'center';
    wrap.appendChild(canvas);
    wrap.appendChild(label);
    row.appendChild(wrap);
  });
};

function generateAll() {
  const log = document.getElementById('log');
  log.textContent = '';
  SIZES.forEach((size, i) => {
    setTimeout(() => {
      const canvas = document.createElement('canvas');
      drawIcon(canvas, size);
      canvas.toBlob(blob => {
        const a   = document.createElement('a');
        a.href    = URL.createObjectURL(blob);
        a.download = `icon-${size}.png`;
        a.click();
        log.textContent += `✓ icon-${size}.png تم تنزيله\n`;
      }, 'image/png');
    }, i * 120);
  });
}
</script>
</body>
</html>
